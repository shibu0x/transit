[package]
name = "transit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
indicatif = "0.18.6"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream","form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
urlencoding = "2.1.3"
webbrowser = "1.2.4"
